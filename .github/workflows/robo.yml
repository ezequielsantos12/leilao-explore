name: Robo Leilao Explore

on:
  schedule:
    - cron: "37 9 * * *"   # todo dia as 06:37 (horario de Belem)
  workflow_dispatch: {}     # botao "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Caixa (lista oficial)
        continue-on-error: true
        run: python robo/robo.py
      - name: Preparar navegador
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Sites dos leiloeiros
        continue-on-error: true
        run: python robo/sites.py
      - name: Salvar se mudou
        run: |
          git config user.name "robo-leilao"
          git config user.email "robo-leilao@users.noreply.github.com"
          git add docs/dados.json docs/sites.json
          git diff --cached --quiet || git commit -m "Listas atualizadas $(date -u +%Y-%m-%d)"
          git push
